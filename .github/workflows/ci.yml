# Builds, checks and tests Hostly on Linux, Windows and macOS, and uploads the
# installers each platform produces (unsigned) as workflow artifacts.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - run: npm ci
      - run: npx tsc --noEmit
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: hostly-${{ runner.os }}
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # The sync server's database tests need PostgreSQL. Service containers only run
  # on Linux runners, so this is a separate job; in the matrix above,
  # TEST_DATABASE_URL is unset and those tests skip themselves.
  sync-server:
    name: sync server (PostgreSQL)
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: hostly
          POSTGRES_PASSWORD: hostly
          POSTGRES_DB: hostly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hostly -d hostly_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://hostly:hostly@localhost:5432/hostly_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p hostly-server
      - name: Docker image builds
        run: docker build -f crates/hostly-server/Dockerfile -t hostly-server .
