[workspace]
resolver = "3"
members = ["src-tauri", "crates/hostly-core", "crates/hostly-protocol", "crates/hostly-server"]

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
